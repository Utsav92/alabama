<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Alabama — Music For Everyone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#121212;--sb:#000;--card:#181818;--cardh:#282828;
  --accent:#E6A817;--accent2:#b8860b;
  --txt:#fff;--sub:#a7a7a7;--sub2:#535353;
  --border:rgba(255,255,255,.08);
  --r:4px;--rl:8px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);
  display:grid;
  grid-template-areas:"sidebar topbar" "sidebar main" "player player";
  grid-template-columns:242px 1fr;
  grid-template-rows:64px 1fr 90px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
img{display:block}
button{cursor:pointer;border:none;font-family:inherit;background:none}

/* ══ SIDEBAR ══ */
.sidebar{
  grid-area:sidebar;grid-row:1/4;
  background:var(--sb);
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  overflow:hidden;
}
.sb-top{padding:20px 12px 8px;flex-shrink:0}
.sb-logo{
  display:flex;align-items:center;gap:10px;
  padding:6px 8px;margin-bottom:4px;cursor:pointer
}
.sb-logo-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--accent);color:#000;
  font-size:1rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.sb-logo-text{font-size:1.25rem;font-weight:900;letter-spacing:-.04em}
.sb-logo-text em{font-style:normal;color:var(--accent)}
.sb-nav{padding:4px 0 8px}
.sb-nav a{
  display:flex;align-items:center;gap:14px;
  padding:10px 12px;border-radius:var(--rl);
  color:var(--sub);font-size:.88rem;font-weight:600;
  transition:all .15s;cursor:pointer
}
.sb-nav a:hover,.sb-nav a.on{color:var(--txt);background:rgba(255,255,255,.06)}
.sb-ic{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0}
.sb-div{height:1px;background:var(--border);margin:6px 12px}
.sb-lib{flex:1;overflow-y:auto;padding:0 8px 8px}
.sb-lib-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 8px 6px;
  font-size:.72rem;font-weight:700;color:var(--sub);
  text-transform:uppercase;letter-spacing:.08em
}
.sb-add{
  width:28px;height:28px;border-radius:50%;color:var(--sub);
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  transition:all .15s
}
.sb-add:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.sb-pl{
  display:flex;align-items:center;gap:10px;
  padding:8px 8px;border-radius:var(--r);cursor:pointer;transition:background .15s
}
.sb-pl:hover{background:rgba(255,255,255,.06)}
.sb-pl-art{
  width:40px;height:40px;border-radius:4px;
  flex-shrink:0;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem
}
.sb-pl-name{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-pl-meta{font-size:.7rem;color:var(--sub);margin-top:2px}

/* ══ TOPBAR ══ */
.topbar{
  grid-area:topbar;
  background:rgba(18,18,18,.9);backdrop-filter:blur(10px);
  display:flex;align-items:center;padding:0 24px;gap:14px;
  border-bottom:1px solid var(--border);z-index:100;position:sticky;top:0
}
.tb-nav{display:flex;gap:6px}
.tb-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.5);color:var(--sub);
  font-size:.85rem;display:flex;align-items:center;justify-content:center;
  transition:all .15s
}
.tb-btn:hover{background:rgba(255,255,255,.15);color:var(--txt)}
.tb-search{flex:1;max-width:360px;position:relative}
.tb-search input{
  width:100%;background:rgba(255,255,255,.1);border:1.5px solid transparent;
  border-radius:20px;color:var(--txt);font-family:inherit;font-size:.85rem;
  padding:9px 16px 9px 38px;outline:none;transition:all .2s
}
.tb-search input:focus{background:rgba(255,255,255,.15);border-color:var(--accent)}
.tb-search input::placeholder{color:var(--sub)}
.tb-search-ic{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--sub);font-size:.85rem;pointer-events:none
}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-upgrade{
  background:transparent;border:1.5px solid rgba(255,255,255,.4);
  color:var(--txt);font-size:.78rem;font-weight:700;
  padding:7px 18px;border-radius:20px;letter-spacing:.04em;
  transition:all .2s
}
.tb-upgrade:hover{border-color:var(--txt);transform:scale(1.02)}
.tb-avatar{
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);color:#000;
  font-size:.82rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0
}

/* ══ MAIN ══ */
.main{
  grid-area:main;overflow-y:auto;scroll-behavior:smooth;
  background:linear-gradient(180deg,#1c1400 0,var(--bg) 340px)
}
.page{display:none}.page.on{display:block;animation:fadeIn .25s ease}

/* ══ HOME ══ */
.greeting{padding:24px 24px 0;font-size:1.7rem;font-weight:900;letter-spacing:-.02em}

/* Quick grid */
.quick-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:20px 24px 0
}
.qi{
  background:var(--card);border-radius:6px;
  display:flex;align-items:center;gap:0;overflow:hidden;
  cursor:pointer;transition:background .15s;position:relative
}
.qi:hover{background:#333}
.qi:hover .qi-play{opacity:1;transform:translateY(0)}
.qi-art{
  width:56px;height:56px;flex-shrink:0;
  background-size:cover;background-position:center;
  border-radius:6px 0 0 6px
}
.qi-name{
  font-size:.85rem;font-weight:700;
  padding:0 14px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.qi-play{
  position:absolute;right:8px;
  width:34px;height:34px;border-radius:50%;
  background:var(--accent);color:#000;font-size:.8rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(4px);transition:all .2s;
  box-shadow:0 4px 18px rgba(0,0,0,.5)
}

/* Section */
.sec{padding:28px 24px 8px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sec-title{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.sec-more{
  font-size:.75rem;font-weight:700;color:var(--sub);
  text-transform:uppercase;letter-spacing:.07em;cursor:pointer;transition:color .15s
}
.sec-more:hover{color:var(--txt)}

/* Card grid */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.cgrid.slim{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.ccard{
  background:var(--card);border-radius:var(--rl);
  padding:16px;cursor:pointer;transition:background .2s;position:relative
}
.ccard:hover{background:var(--cardh)}
.ccard:hover .cc-play{opacity:1;transform:translateY(0)}
.cc-art{
  width:100%;aspect-ratio:1/1;border-radius:var(--r);
  background-size:cover;background-position:center;
  margin-bottom:14px;position:relative;overflow:hidden
}
.ccard.artist .cc-art{border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cc-play{
  position:absolute;bottom:8px;right:8px;
  width:44px;height:44px;border-radius:50%;
  background:var(--accent);color:#000;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(8px);transition:all .22s;
  box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:2
}
.cc-play:hover{background:#f0c030;transform:scale(1.06) translateY(0) !important}
.cc-title{font-size:.88rem;font-weight:700;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-sub{font-size:.76rem;color:var(--sub);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ══ ARTIST PAGE ══ */
.artist-pg{
  display:none;position:absolute;
  top:64px;left:242px;right:0;bottom:90px;
  background:var(--bg);overflow-y:auto;z-index:50;
  scroll-behavior:smooth
}
.artist-pg.open{display:block;animation:fadeIn .25s ease}
.ap-hero{
  position:relative;height:380px;
  background-size:cover;background-position:center 20%
}
.ap-grad{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,.6) 55%,var(--bg) 100%)
}
.ap-back{
  position:absolute;top:18px;left:18px;
  width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.6);color:var(--txt);
  font-size:.9rem;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:3;transition:background .15s
}
.ap-back:hover{background:rgba(0,0,0,.85)}
.ap-info{position:absolute;bottom:20px;left:24px;right:24px}
.ap-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.7rem;font-weight:700;color:rgba(255,255,255,.8);
  margin-bottom:6px
}
.ap-tick{
  width:18px;height:18px;border-radius:50%;background:#3b82f6;
  display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#fff
}
.ap-name{font-size:clamp(2.2rem,6vw,4.8rem);font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:6px}
.ap-listeners{font-size:.85rem;color:rgba(255,255,255,.7)}
.ap-acts{
  padding:20px 24px;display:flex;align-items:center;gap:16px;
  background:linear-gradient(to bottom,var(--bg),transparent)
}
.ap-play{
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#000;font-size:1.2rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s;box-shadow:0 8px 30px rgba(230,168,23,.3)
}
.ap-play:hover{background:#f0c030;transform:scale(1.06)}
.ap-follow{
  background:transparent;border:1.5px solid rgba(255,255,255,.35);
  color:var(--txt);font-size:.83rem;font-weight:700;
  padding:9px 24px;border-radius:20px;letter-spacing:.03em;transition:all .15s
}
.ap-follow:hover{border-color:var(--txt)}
.ap-dots{color:var(--sub);font-size:1.4rem;padding:4px 10px;transition:color .15s}
.ap-dots:hover{color:var(--txt)}

/* Song list */
.slist{padding:0 24px 32px}
.slist-hdr{
  display:grid;grid-template-columns:36px 5fr 3fr 2fr 60px;gap:12px;
  padding:6px 12px;font-size:.72rem;color:var(--sub);
  font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  border-bottom:1px solid var(--border);margin-bottom:2px
}
.srow{
  display:grid;grid-template-columns:36px 5fr 3fr 2fr 60px;gap:12px;align-items:center;
  padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .15s
}
.srow:hover{background:rgba(255,255,255,.07)}
.srow:hover .sr-n{display:none}
.srow:hover .sr-pi{display:flex}
.sr-n{font-size:.88rem;color:var(--sub);text-align:center}
.sr-pi{display:none;align-items:center;justify-content:center;font-size:.78rem;color:var(--txt)}
.sr-tw{display:flex;align-items:center;gap:12px;min-width:0}
.sr-a{width:40px;height:40px;border-radius:4px;background-size:cover;background-position:center;flex-shrink:0}
.sr-t{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-at{font-size:.76rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-al{font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-pl{font-size:.8rem;color:var(--sub)}
.sr-d{font-size:.8rem;color:var(--sub);text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.sr-hrt{color:var(--sub);transition:color .15s;font-size:.82rem}
.srow:hover .sr-hrt{color:var(--txt)}

/* Related / popular sec inside artist page */
.ap-related{padding:0 24px 32px}

/* ══ PLAYER ══ */
.player{
  grid-area:player;background:#0a0a0a;border-top:1px solid var(--border);
  display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;
  padding:0 16px;gap:12px;z-index:200;position:relative
}
.pl-l{display:flex;align-items:center;gap:12px;min-width:0}
.pl-art{
  width:56px;height:56px;border-radius:4px;flex-shrink:0;
  background-size:cover;background-position:center;cursor:pointer;
  transition:border-radius .3s
}
.pl-art.playing{animation:spinSlow 8s linear infinite;border-radius:50%}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.pl-inf{min-width:0}
.pl-title{font-size:.83rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pl-title:hover{text-decoration:underline}
.pl-artist{font-size:.72rem;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-hrt{font-size:.9rem;color:var(--sub);cursor:pointer;transition:color .15s;flex-shrink:0;padding:4px}
.pl-hrt:hover,.pl-hrt.on{color:var(--accent)}

.pl-c{display:flex;flex-direction:column;align-items:center;gap:8px}
.pl-btns{display:flex;align-items:center;gap:18px}
.pb{color:var(--sub);font-size:.95rem;padding:4px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.pb:hover{color:var(--txt);transform:scale(1.08)}
.pb.on{color:var(--accent)}
.pb-play{
  width:36px;height:36px;border-radius:50%;
  background:var(--txt);color:#000;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s
}
.pb-play:hover{background:#ddd;transform:scale(1.06)}
.pl-prog{width:100%;display:flex;align-items:center;gap:10px}
.pl-tm{font-size:.68rem;color:var(--sub);width:34px;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}
.prog-track{
  flex:1;height:4px;background:rgba(255,255,255,.15);
  border-radius:2px;cursor:pointer;position:relative;transition:height .15s
}
.prog-track:hover{height:6px}
.prog-fill{height:100%;background:var(--txt);border-radius:2px;width:0;position:relative;transition:background .15s}
.prog-track:hover .prog-fill{background:var(--accent)}
.prog-fill::after{
  content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--txt);
  opacity:0;transition:opacity .15s
}
.prog-track:hover .prog-fill::after{opacity:1}

.pl-r{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.vol-wrap{display:flex;align-items:center;gap:8px}
.vol-trk{
  width:80px;height:4px;background:rgba(255,255,255,.15);
  border-radius:2px;cursor:pointer;position:relative;transition:height .15s
}
.vol-trk:hover{height:6px}
.vol-fill{height:100%;background:var(--txt);border-radius:2px;width:70%}
.vol-trk:hover .vol-fill{background:var(--accent)}

/* ══ SEARCH PAGE ══ */
.sp-title{font-size:1.4rem;font-weight:800;padding:20px 0 14px}
.sp-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.sp-cat{
  border-radius:var(--rl);height:108px;position:relative;
  overflow:hidden;cursor:pointer;transition:filter .18s
}
.sp-cat:hover{filter:brightness(1.18)}
.sp-cat-name{font-size:1rem;font-weight:800;padding:14px 14px 0;position:relative;z-index:2}
.sp-cat-img{
  position:absolute;right:-8px;bottom:-8px;
  width:68px;height:68px;border-radius:6px;
  transform:rotate(30deg);background-size:cover;background-position:center;
  box-shadow:4px 4px 14px rgba(0,0,0,.4);z-index:1
}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:#282828;border:1px solid #444;border-radius:8px;
  padding:10px 22px;font-size:.83rem;font-weight:600;
  z-index:3000;opacity:0;transition:all .25s;
  pointer-events:none;white-space:nowrap
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ MISC ══ */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eq-icon{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq-bar{width:3px;background:var(--accent);border-radius:1px;animation:eqBounce .8s ease-in-out infinite}
.eq-bar:nth-child(2){animation-delay:.2s}
.eq-bar:nth-child(3){animation-delay:.1s}
@keyframes eqBounce{0%,100%{height:4px}50%{height:14px}}
@media(max-width:860px){
  body{grid-template-columns:180px 1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
  .artist-pg{left:180px}
  .slist-hdr,.srow{grid-template-columns:36px 4fr 2fr 60px}
  .slist-hdr span:nth-child(4),.srow .sr-al{display:none}
}
@media(max-width:640px){
  body{grid-template-areas:"topbar" "main" "player";grid-template-columns:1fr;grid-template-rows:56px 1fr 88px}
  .sidebar,.artist-pg{left:0}
  .sidebar{display:none}
  .quick-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ════════ SIDEBAR ════════ -->
<nav class="sidebar">
  <div class="sb-top">
    <div class="sb-logo" onclick="goHome()">
      <div class="sb-logo-icon">♪</div>
      <div class="sb-logo-text"><em>al</em>abama</div>
    </div>
    <div class="sb-nav">
      <a id="nav-home" class="on" onclick="goHome()"><span class="sb-ic">🏠</span> Home</a>
      <a id="nav-search" onclick="goSearch()"><span class="sb-ic">🔍</span> Search</a>
    </div>
  </div>
  <div class="sb-div"></div>
  <div class="sb-lib">
    <div class="sb-lib-hdr">
      Your Library
      <button class="sb-add" onclick="showToast('✚ Create playlist')">+</button>
    </div>
    <div id="sbPlaylists"></div>
  </div>
</nav>

<!-- ════════ TOPBAR ════════ -->
<header class="topbar">
  <div class="tb-nav">
    <button class="tb-btn" onclick="history.back()">‹</button>
    <button class="tb-btn" onclick="history.forward()">›</button>
  </div>
  <div class="tb-search">
    <span class="tb-search-ic">🔍</span>
    <input type="text" id="searchInput" placeholder="What do you want to play?" oninput="handleSearch(this.value)" onfocus="goSearch()">
  </div>
  <div class="tb-right">
    <button class="tb-upgrade" onclick="showToast('🎵 Premium — unlimited skips, offline playback')">Explore Premium</button>
    <div class="tb-avatar" title="Profile">U</div>
  </div>
</header>

<!-- ════════ MAIN ════════ -->
<main class="main" id="mainArea">

  <!-- HOME PAGE -->
  <div class="page on" id="homePage">
    <div class="greeting" id="greeting">Good evening</div>

    <!-- Recently Played -->
    <div class="quick-grid" id="quickGrid"></div>

    <!-- Featured Section -->
    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-title">Popular Artists</div>
        <div class="sec-more" onclick="showToast('📀 See all artists')">See all</div>
      </div>
      <div class="cgrid slim" id="artistGrid"></div>
    </div>

    <!-- New Releases -->
    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-title">New Releases</div>
        <div class="sec-more" onclick="showToast('💿 All new releases')">See all</div>
      </div>
      <div class="cgrid" id="newRelGrid"></div>
    </div>

    <!-- Made For You -->
    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-title">Made For You</div>
        <div class="sec-more" onclick="showToast('🎧 Your mixes')">See all</div>
      </div>
      <div class="cgrid" id="mfyGrid"></div>
    </div>

    <!-- Trending -->
    <div class="sec">
      <div class="sec-hdr">
        <div class="sec-title">🔥 Trending</div>
        <div class="sec-more" onclick="showToast('📈 Trending charts')">See all</div>
      </div>
      <div class="cgrid slim" id="trendGrid"></div>
    </div>

    <div style="height:32px"></div>
  </div><!-- /home -->

  <!-- SEARCH PAGE -->
  <div class="page" id="searchPage" style="padding:20px 24px">
    <div class="sp-title" id="searchTitle">Browse Categories</div>
    <div id="searchResults"></div>
    <div class="sp-cats" id="searchCats"></div>

// ════ GREETING ════
function setGreeting(){
  const h=new Date().getHours();
  const g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  document.getElementById('greeting').textContent=g;
}

// ════ ARTIST PAGE ════
let currentArtist=null;
function openArtist(id){
  const a=ARTISTS[id];
  currentArtist=a;
  currentArtistId=id;
  const pg=document.getElementById('artistPg');
  document.getElementById('apHero').style.backgroundImage=`url('${a.img}')`;
  document.getElementById('apHero').style.background=`${a.clr}`;
  document.getElementById('apHero').style.backgroundImage=`url('${a.img}')`;
  document.getElementById('apName').textContent=a.name;
  document.getElementById('apListeners').textContent=`${a.listeners} monthly listeners`;
  document.getElementById('apFollowBtn').textContent='Follow';
  buildApSongs(id);
  buildApAlbums(id);
  buildApRelated(id);
  pg.classList.add('open');
  pg.scrollTop=0;
}
function closeArtist(){
  document.getElementById('artistPg').classList.remove('open');
  currentArtistId=-1;
}
function buildApSongs(id){
  const songs=SONGS_MAP[id]||[];
  const al=ALBUMS;
  document.getElementById('apSongs').innerHTML=songs.map((s,i)=>{
    const alb=al[s.alb]||{albumImg:'',clr:'#333'};
    return`<div class="srow" onclick="playSong(${id},${i})">
      <span class="sr-n">${i+1}</span>
      <span class="sr-pi">▶</span>
      <div class="sr-tw">
        <div class="sr-a" style="background-image:url('${alb.albumImg}');background-color:${alb.clr}"></div>
        <div><div class="sr-t">${s.t}</div><div class="sr-at">${ARTISTS[id].name}</div></div>
      </div>
      <span class="sr-al">${s.al}</span>
      <span class="sr-pl">${s.pl}</span>
      <div class="sr-d">
        <span class="sr-hrt" onclick="event.stopPropagation();this.classList.toggle('liked');this.textContent=this.classList.contains('liked')?'♥':'♡'">♡</span>
        ${s.d}
      </div>
    </div>`;
  }).join('');
}
function buildApAlbums(id){
  const albs=ALBUMS.filter(a=>a.artistId===id);
  const all=albs.length?albs:ALBUMS.slice(0,4);
  document.getElementById('apAlbums').innerHTML=all.map(al=>`
    <div class="ccard" onclick="showToast('💿 ${al.title}')">
      <div class="cc-art" style="background-image:url('${al.albumImg}');background-color:${al.clr}">
        <div class="cc-play">▶</div>
      </div>
      <div class="cc-title">${al.title}</div>
      <div class="cc-sub">${al.artist}</div>
    </div>`).join('');
}
function buildApRelated(id){
  const others=ARTISTS.filter((_,i)=>i!==id).slice(0,6);
  document.getElementById('apRelated').innerHTML=others.map(a=>`
    <div class="ccard artist" onclick="openArtist(${a.id})">
      <div class="cc-art" style="background-image:url('${a.img}');background-color:${a.clr}">
        <div class="cc-play">▶</div>
      </div>
      <div class="cc-title">${a.name}</div>
      <div class="cc-sub">Artist</div>
    </div>`).join('');
}
function toggleFollow(btn){
  const on=btn.textContent==='Following';
  btn.textContent=on?'Follow':'Following';
  btn.style.borderColor=on?'rgba(255,255,255,.35)':'var(--accent)';
  btn.style.color=on?'var(--txt)':'var(--accent)';
  showToast(on?`Unfollowed ${currentArtist?.name}`:`Following ${currentArtist?.name}`);
}
function playCurrentArtist(){if(currentArtistId>=0)playSong(currentArtistId,0);}

// ════ NAVIGATION ════
function goHome(){
  setPage('homePage');
  setNavOn('nav-home');
  document.getElementById('searchInput').value='';
}
function goSearch(){
  setPage('searchPage');
  setNavOn('nav-search');
  document.getElementById('searchTitle').textContent='Browse Categories';
  document.getElementById('searchResults').innerHTML='';
  document.getElementById('searchCats').style.display='grid';
}
function setPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');}
function setNavOn(id){document.querySelectorAll('.sb-nav a').forEach(a=>a.classList.remove('on'));document.getElementById(id)?.classList.add('on');}

function handleSearch(v){
  if(!v.trim()){goSearch();return;}
  setPage('searchPage');
  setNavOn('nav-search');
  document.getElementById('searchTitle').textContent=`Results for "${v}"`;
  document.getElementById('searchCats').style.display='none';
  const q=v.toLowerCase();
  const matched=ARTISTS.filter(a=>a.name.toLowerCase().includes(q)||a.genre.toLowerCase().includes(q));
  const res=document.getElementById('searchResults');
  if(!matched.length){res.innerHTML='<p style="color:var(--sub);padding:20px 0">No results found.</p>';return;}
  res.innerHTML=`<div class="cgrid slim" style="margin-bottom:24px">${matched.map(a=>`
    <div class="ccard artist" onclick="openArtist(${a.id})">
      <div class="cc-art" style="background-image:url('${a.img}');background-color:${a.clr}">
        <div class="cc-play">▶</div>
      </div>
      <div class="cc-title">${a.name}</div>
      <div class="cc-sub">Artist · ${a.genre}</div>
    </div>`).join('')}</div>`;
}

// ════ PLAYER ════
function playSong(artistId,songIdx){
  const a=ARTISTS[artistId];
  const songs=SONGS_MAP[artistId]||[];
  const s=songs[songIdx]||songs[0];
  if(!s)return;
  const al=ALBUMS[s.alb]||{albumImg:'',clr:a.clr};
  playerState.playing=true;
  playerState.artistId=artistId;
  playerState.songIdx=songIdx;
  playerState.progress=0;
  // duration in seconds
  const [m,sec]=s.d.split(':').map(Number);
  playerState.duration=(m*60+sec)||200;
  document.getElementById('plArt').style.backgroundImage=`url('${al.albumImg||a.img}')`;
  document.getElementById('plArt').style.backgroundColor=al.clr||a.clr;
  document.getElementById('plTitle').textContent=s.t;
  document.getElementById('plArtist').textContent=a.name;
  document.getElementById('plDur').textContent=s.d;
  document.getElementById('plArt').classList.add('playing');
  document.getElementById('playBtn').textContent='⏸';
  clearInterval(playerState.intervalId);
  playerState.intervalId=setInterval(tickProgress,500);
}
function tickProgress(){
  if(!playerState.playing)return;
  playerState.progress=Math.min(playerState.duration,playerState.progress+0.5);
  const pct=playerState.progress/playerState.duration*100;
  document.getElementById('progFill').style.width=pct+'%';
  const cur=Math.floor(playerState.progress);
  document.getElementById('plCur').textContent=`${Math.floor(cur/60)}:${String(cur%60).padStart(2,'0')}`;
  if(playerState.progress>=playerState.duration){
    if(playerState.repeat)playerState.progress=0;
    else nextTrack();
  }
}
function togglePlay(){
  playerState.playing=!playerState.playing;
  document.getElementById('playBtn').textContent=playerState.playing?'⏸':'▶';
  document.getElementById('plArt').classList.toggle('playing',playerState.playing);
}
function nextTrack(){
  const songs=SONGS_MAP[playerState.artistId]||[];
  const next=(playerState.songIdx+1)%songs.length;
  playSong(playerState.artistId,next);
}
function prevTrack(){
  if(playerState.progress>3){playerState.progress=0;return;}
  const songs=SONGS_MAP[playerState.artistId]||[];
  const prev=(playerState.songIdx-1+songs.length)%songs.length;
  playSong(playerState.artistId,prev);
}
function toggleShuffle(){
  playerState.shuffle=!playerState.shuffle;
  document.getElementById('shuffleBtn').classList.toggle('on',playerState.shuffle);
  showToast(playerState.shuffle?'🔀 Shuffle on':'Shuffle off');
}
function toggleRepeat(){
  playerState.repeat=!playerState.repeat;
  document.getElementById('repeatBtn').classList.toggle('on',playerState.repeat);
  showToast(playerState.repeat?'🔁 Repeat on':'Repeat off');
}
function toggleMute(){
  playerState.muted=!playerState.muted;
  document.getElementById('volIcon').textContent=playerState.muted?'🔇':'🔊';
  document.getElementById('volFill').style.width=playerState.muted?'0%':playerState.vol+'%';
}
function setVol(e){
  const r=document.getElementById('volTrk').getBoundingClientRect();
  const pct=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
  playerState.vol=pct;
  playerState.muted=pct===0;
  document.getElementById('volFill').style.width=pct+'%';
  document.getElementById('volIcon').textContent=pct===0?'🔇':pct<50?'🔉':'🔊';
}
function seekTo(e){
  const r=document.getElementById('progTrack').getBoundingClientRect();
  const pct=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));
  playerState.progress=pct/100*playerState.duration;
  document.getElementById('progFill').style.width=pct+'%';
}

// ════ TOAST ════
let toastTm=null;
function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastTm);toastTm=setTimeout(()=>t.classList.remove('show'),2800);
}

// ════ INIT ════
buildSidebar();
buildQuickGrid();
buildArtistGrid();
buildNewReleases();
buildMFY();
buildTrending();
buildSearchCats();
setGreeting();
</script>
